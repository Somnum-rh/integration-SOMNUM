name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SomNum Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://fsapkxbizettyqvkmafl.supabase.co/rest/v1/reponses?select=id&limit=1" \
            -H "apikey: sb_publishable_e5NS3uSwe_xYB0RUgeSSHQ_H9J6_Kfz" \
            -H "Authorization: Bearer sb_publishable_e5NS3uSwe_xYB0RUgeSSHQ_H9J6_Kfz") || STATUS="error"
          echo "SomNum → HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ SomNum OK" || echo "⚠️ SomNum: $STATUS (peut être en pause)"
          exit 0

      - name: Ping BecomeUs Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://cqkumhjujfgypjfsptfp.supabase.co/rest/v1/team_members?select=id&limit=1" \
            -H "apikey: sb_publishable_ET2z2RbpQY62ATUslTAEHg_1XIjP8S2" \
            -H "Authorization: Bearer sb_publishable_ET2z2RbpQY62ATUslTAEHg_1XIjP8S2") || STATUS="error"
          echo "BecomeUs → HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ BecomeUs OK" || echo "⚠️ BecomeUs: $STATUS (peut être en pause)"
          exit 0

      - name: Résumé
        run: echo "🏓 Ping terminé — $(date '+%d/%m/%Y %H:%M')"
